
name: NusaFit Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: nusafit-signed-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'VERSION_17' app/build.gradle.kts
          grep -q 'jvmToolchain(17)' app/build.gradle.kts
          grep -q '@mipmap/ic_launcher' app/src/main/AndroidManifest.xml

      - name: Prepare signing keystore
        env:
          NUSAFIT_KEYSTORE_B64: ${{ secrets.NUSAFIT_KEYSTORE_B64 }}
          NUSAFIT_STORE_PASSWORD: ${{ secrets.NUSAFIT_STORE_PASSWORD }}
          NUSAFIT_KEY_ALIAS: ${{ secrets.NUSAFIT_KEY_ALIAS }}
          NUSAFIT_KEY_PASSWORD: ${{ secrets.NUSAFIT_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NUSAFIT_KEYSTORE_B64" || { echo "Missing secret NUSAFIT_KEYSTORE_B64"; exit 1; }
          test -n "$NUSAFIT_STORE_PASSWORD" || { echo "Missing secret NUSAFIT_STORE_PASSWORD"; exit 1; }
          test -n "$NUSAFIT_KEY_ALIAS" || { echo "Missing secret NUSAFIT_KEY_ALIAS"; exit 1; }
          test -n "$NUSAFIT_KEY_PASSWORD" || { echo "Missing secret NUSAFIT_KEY_PASSWORD"; exit 1; }
          printf '%s' "$NUSAFIT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nusafit-release.keystore"
          test -s "$RUNNER_TEMP/nusafit-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/nusafit-release.keystore" \
            -storepass "$NUSAFIT_STORE_PASSWORD" >/dev/null
          echo "Keystore berhasil dibaca dan password store valid."

      - name: Build signed Release APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NUSAFIT_STORE_PASSWORD: ${{ secrets.NUSAFIT_STORE_PASSWORD }}
          NUSAFIT_KEY_ALIAS: ${{ secrets.NUSAFIT_KEY_ALIAS }}
          NUSAFIT_KEY_PASSWORD: ${{ secrets.NUSAFIT_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all \
            -PNUSAFIT_KEYSTORE="$RUNNER_TEMP/nusafit-release.keystore" \
            -PNUSAFIT_STORE_PASSWORD="$NUSAFIT_STORE_PASSWORD" \
            -PNUSAFIT_KEY_ALIAS="$NUSAFIT_KEY_ALIAS" \
            -PNUSAFIT_KEY_PASSWORD="$NUSAFIT_KEY_PASSWORD" \
            assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name "apksigner" -print -quit)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p release
          cp "$APK" "release/NusaFit-v${{ github.run_number }}-release-signed.apk"
          ls -lh release/*.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Signed-Release-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
